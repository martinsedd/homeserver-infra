apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zulip-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: homeserver
  source:
    repoURL: git@github.com:martinsedd/homeserver-infra.git
    targetRevision: develop
    path: cluster/workloads/zulip
  destination:
    server: https://kubernetes.default.svc
    namespace: zulip
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
