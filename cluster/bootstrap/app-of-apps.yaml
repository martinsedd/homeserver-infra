apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homeserver
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:martinsedd/homeserver-infra.git
    targetRevision: develop
    path: cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
