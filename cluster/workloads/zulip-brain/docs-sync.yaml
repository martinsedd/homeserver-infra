apiVersion: batch/v1
kind: CronJob
metadata:
  name: docs-sync
  namespace: zulip-brain
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: alpine:3.21
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  REPO=ssh://git@forgejo-ssh.forgejo.svc.cluster.local:2222/theGALILAI/galilai.git
                  apk add --no-cache git openssh-client >/dev/null
                  mkdir -p /tmp/.ssh
                  cp /keys/id_ed25519 /tmp/.ssh/id_ed25519
                  chmod 600 /tmp/.ssh/id_ed25519
                  export HOME=/tmp
                  export GIT_SSH_COMMAND="ssh -i /tmp/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new"
                  rm -rf /data/docs-repo.new
                  git clone --depth 1 --branch develop --filter=blob:none --sparse "$REPO" /data/docs-repo.new
                  git -C /data/docs-repo.new sparse-checkout set docs
                  rm -rf /data/docs-repo
                  mv /data/docs-repo.new /data/docs-repo
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: key
                  mountPath: /keys
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: jeeves-data
            - name: key
              secret:
                secretName: docs-deploy-key
                defaultMode: 0400
