apiVersion: v1
kind: Namespace
metadata:
  name: zulip-brain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jeeves-data
  namespace: zulip-brain
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jeeves-config
  namespace: zulip-brain
data:
  ZULIP_SITE: https://chat.thegalilai.com
  ZULIP_BOT_EMAIL: jeeves-bot@chat.thegalilai.com
  ZULIP_STREAMS: "*"
  OLLAMA_URL: http://ollama.ollama.svc.cluster.local:11434
  EMBED_MODEL: mxbai-embed-large
  CHAT_MODEL: qwen2.5:7b-instruct-q4_K_M
  NUM_CTX: "8192"
  DB_PATH: /data/brain.db
  LISTEN_ADDR: ":9090"
  LOG_LEVEL: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jeeves
  namespace: zulip-brain
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jeeves
  template:
    metadata:
      labels:
        app: jeeves
    spec:
      imagePullSecrets:
        - name: forgejo-registry
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      initContainers:
        - name: chown-data
          image: busybox:1.37
          command: ["sh", "-c", "chown -R 65532:65532 /data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: jeeves
          image: git.lampilabs.com/martinsedd/zulip-brain:8b2f86e87ed9ffefb955a8c6ed1f72e5a911366c
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: jeeves-config
          env:
            - name: ZULIP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jeeves-secrets
                  key: api-key
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jeeves-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jeeves
  namespace: zulip-brain
  labels:
    app: jeeves
spec:
  selector:
    app: jeeves
  ports:
    - name: http
      port: 9090
      targetPort: http
